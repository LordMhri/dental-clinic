# ==============================================================================
# LEWI DENTAL CLINIC ERP - PRODUCTION DOCKER COMPOSE STACK
# All services operate within an isolated Docker network.
# Database and MinIO ports are bound locally to 127.0.0.1 for maximum host security.
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 LTS Database
  # ----------------------------------------------------------------------------
  sys-db-service:
    image: postgres:16-alpine
    container_name: sys-db-service
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-sysadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinic_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-dental_clinic_db}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - sys-isolated-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sysadmin} -d ${DB_NAME:-dental_clinic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # ----------------------------------------------------------------------------
  # 2. MinIO S3 Object Storage (Dental Scans, Periapical X-rays & Lightbox)
  # ----------------------------------------------------------------------------
  sys-storage-service:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: sys-storage-service
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sysminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    networks:
      - sys-isolated-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------------------------
  # 3. Node.js 22 LTS Core Express + Zod API
  # ----------------------------------------------------------------------------
  sys-core-service:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sys-core-service
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-sysadmin}:${DB_PASSWORD:-clinic_secure_pass_2026}@sys-db-service:5432/${DB_NAME:-dental_clinic_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-production_secure_jwt_secret_lewi_2026}
      S3_ENDPOINT: http://sys-storage-service:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sysminio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
      S3_BUCKET: ${S3_BUCKET:-dental-assets}
      S3_REGION: us-east-1
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CLINIC_CHAT_ID: ${TELEGRAM_CLINIC_CHAT_ID:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    depends_on:
      sys-db-service:
        condition: service_healthy
      sys-storage-service:
        condition: service_healthy
    networks:
      - sys-isolated-net
    deploy:
      resources:
        limits:
          memory: 1024M

networks:
  sys-isolated-net:
    name: sys-isolated-net
    driver: bridge

volumes:
  pgdata:
    name: sys-postgres-data
  miniodata:
    name: sys-minio-data
